name: Scheduled nightly workflows

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:

  run-ci:
    name: Run nightly workflows
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'keycloak/keycloak-client'

    strategy:
      matrix:
        base-branch:
          - release/26.0

    steps:
      - name: Run ci.yml workflow
        run: gh workflow run -R ${{ github.repository }} ci.yml -f base-branch=${{ matrix.base-branch }} -r ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release-nightly.yml workflow
        run: gh workflow run -R ${{ github.repository }} release-nightly.yml -r ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
